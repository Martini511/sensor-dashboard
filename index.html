<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Controller Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🎮 Controller Dashboard</h1>

    <!-- Verbindungsstatus -->
    <div class="card" id="status-card">
      <div class="status-row">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">
          Kein Controller verbunden
        </span>
      </div>
      <p class="hint">
        Verbinde deinen Controller per Bluetooth
        und drücke eine Taste
      </p>
    </div>

    <!-- Controller Info -->
    <div class="card hidden" id="info-card">
      <h2>ℹ️ Controller Info</h2>
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Name</span>
          <span class="info-value" id="ctrl-name">--</span>
        </div>
        <div class="info-item">
          <span class="info-label">Index</span>
          <span class="info-value" id="ctrl-index">--</span>
        </div>
        <div class="info-item">
          <span class="info-label">Tasten</span>
          <span class="info-value" id="ctrl-buttons">--</span>
        </div>
        <div class="info-item">
          <span class="info-label">Achsen</span>
          <span class="info-value" id="ctrl-axes">--</span>
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="card hidden" id="buttons-card">
      <h2>🔘 Tasten</h2>
      <div class="buttons-grid" id="buttons-grid"></div>
    </div>

    <!-- Achsen -->
    <div class="card hidden" id="axes-card">
      <h2>🕹️ Achsen / Joysticks</h2>

      <!-- Linker Joystick -->
      <div class="joystick-row">
        <div class="joystick-label">Links</div>
        <div class="joystick-container">
          <canvas id="joystick-left"
                  width="120"
                  height="120">
          </canvas>
        </div>
        <div class="axis-values">
          <span>X: <b id="axis-0">0.00</b></span>
          <span>Y: <b id="axis-1">0.00</b></span>
        </div>
      </div>

      <!-- Rechter Joystick -->
      <div class="joystick-row">
        <div class="joystick-label">Rechts</div>
        <div class="joystick-container">
          <canvas id="joystick-right"
                  width="120"
                  height="120">
          </canvas>
        </div>
        <div class="axis-values">
          <span>X: <b id="axis-2">0.00</b></span>
          <span>Y: <b id="axis-3">0.00</b></span>
        </div>
      </div>

      <!-- Alle Achsen Balken -->
      <div class="axes-bars" id="axes-bars"></div>
    </div>

    <!-- Raw Data Log -->
    <div class="card hidden" id="log-card">
      <h2>📋 Raw Data</h2>
      <div class="log-box" id="log-box"></div>
      <button class="clear-btn" onclick="clearLog()">
        🗑️ Leeren
      </button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
